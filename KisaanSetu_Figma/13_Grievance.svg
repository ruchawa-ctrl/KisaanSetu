<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><filter id="s"><feDropShadow dy="22" stdDeviation="20" flood-opacity=".16"/></filter></defs><rect width="1080" height="1920" fill="#eef3e4"/><rect x="210" y="55" width="660" height="1810" rx="76" fill="#253c31" filter="url(#s)"/><rect x="270" y="112" width="540" height="1696" rx="45" fill="#f6f4ed"/><rect x="478" y="89" width="104" height="8" rx="4" fill="#18231d"/><g font-family="DM Sans,Segoe UI,sans-serif" fill="#18231d"><text x="315" y="260" font-size="13" fill="#7e887f" letter-spacing="2">सहायता और समर्थन</text><text x="315" y="320" font-family="Georgia,serif" font-size="39">शिकायत दर्ज करें</text><text x="315" y="365" font-size="18" fill="#748078">हम आपकी समस्या को ऑर्डर से जोड़े रखेंगे।</text><rect x="315" y="430" width="450" height="125" rx="14" fill="#fae0c8"/><text x="340" y="472" font-size="17" fill="#9a512f" font-weight="700">किस ऑर्डर को ध्यान देने की आवश्यकता है?</text><text x="340" y="515" font-size="16" fill="#735648">नासिक लाल प्याज · एबीसी फूड्स</text><text x="315" y="640" font-size="15" fill="#56635b" font-weight="700">क्या हुआ?</text><rect x="315" y="660" width="450" height="150" rx="10" fill="#fff" stroke="#dedfd7"/><text x="340" y="705" font-size="17" fill="#89928b">अपनी भाषा में समस्या बताएं...</text><text x="315" y="900" font-size="15" fill="#56635b" font-weight="700">पसंदीदा सहायता</text><rect x="315" y="925" width="212" height="58" rx="8" fill="#edf3df" stroke="#b9cf8a"/><text x="421" y="962" text-anchor="middle" font-size="17" fill="#2f5d50" font-weight="700">मुझे कॉल करें</text><rect x="550" y="925" width="215" height="58" rx="8" fill="#fff" stroke="#dedfd7"/><text x="657" y="962" text-anchor="middle" font-size="17" fill="#2f5d50">संदेश</text><rect x="315" y="1060" width="450" height="64" rx="8" fill="#2f5d50"/><text x="540" y="1101" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">शिकायत भेजें</text><text x="540" y="1210" text-anchor="middle" font-size="16" fill="#748078">आपको ट्रैकिंग नंबर मिलेगा।</text></g></svg>