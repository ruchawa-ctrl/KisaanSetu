<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><filter id="s"><feDropShadow dy="22" stdDeviation="20" flood-opacity=".16"/></filter></defs><rect width="1080" height="1920" fill="#eef3e4"/><rect x="210" y="55" width="660" height="1810" rx="76" fill="#253c31" filter="url(#s)"/><rect x="270" y="112" width="540" height="1696" rx="45" fill="#f6f4ed"/><rect x="478" y="89" width="104" height="8" rx="4" fill="#18231d"/><g font-family="DM Sans,Segoe UI,sans-serif" fill="#18231d"><text x="315" y="260" font-size="13" fill="#7e887f" letter-spacing="2">किसान सेतु गणना</text><text x="315" y="320" font-family="Georgia,serif" font-size="39">मैं वास्तव में कितना कमाऊँगा?</text><text x="315" y="365" font-size="18" fill="#748078">सबसे अधिक मूल्य हमेशा सबसे अधिक वास्तविक आय नहीं होता।</text><rect x="315" y="430" width="450" height="160" rx="15" fill="#2f5d50"/><text x="340" y="475" font-size="14" fill="#bcd777" font-weight="700">अनुमानित शुद्ध आय</text><text x="340" y="540" font-size="43" fill="#fff" font-weight="700">₹14,650</text><text x="650" y="540" font-size="16" fill="#d9e8a6">500 किग्रा के लिए</text><text x="315" y="680" font-size="15" fill="#7e887f" letter-spacing="1">गणना</text><rect x="315" y="720" width="450" height="280" rx="15" fill="#fbfaf6" stroke="#dedfd7"/><text x="345" y="770" font-size="19">कुल बिक्री मूल्य</text><text x="690" y="770" text-anchor="end" font-size="19" font-weight="700">₹15,500</text><text x="345" y="830" font-size="19">परिवहन</text><text x="690" y="830" text-anchor="end" font-size="19" fill="#9a512f">− ₹750</text><text x="345" y="890" font-size="19">अनुमानित हैंडलिंग और नुकसान</text><text x="690" y="890" text-anchor="end" font-size="19" fill="#9a512f">− ₹100</text><line x1="345" y1="920" x2="735" y2="920" stroke="#dedfd7"/><text x="345" y="965" font-size="22" font-weight="700">प्राप्त होने की उम्मीद</text><text x="690" y="965" text-anchor="end" font-size="22" fill="#2f5d50" font-weight="700">₹14,650</text><rect x="315" y="1085" width="450" height="115" rx="14" fill="#edf3df"/><text x="340" y="1127" font-size="17" fill="#41613b" font-weight="700">सरल व्याख्या</text><text x="340" y="1164" font-size="16" fill="#56635b">हम उन लागतों को घटाते हैं जो</text><text x="340" y="1188" font-size="16" fill="#56635b">आपके हाथ तक पहुँचने वाले को कम करती हैं।</text></g></svg>