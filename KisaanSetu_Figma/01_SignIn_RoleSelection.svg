<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f4ed"/><stop offset="1" stop-color="#e7efda"/></linearGradient><filter id="s"><feDropShadow dy="25" stdDeviation="24" flood-opacity=".16"/></filter></defs><rect width="1080" height="1920" fill="url(#bg)"/><rect x="210" y="55" width="660" height="1810" rx="76" fill="#253c31" filter="url(#s)"/><rect x="270" y="112" width="540" height="1696" rx="45" fill="#fbfaf6"/><rect x="478" y="89" width="104" height="8" rx="4" fill="#18231d"/><g font-family="DM Sans,Segoe UI,sans-serif" fill="#18231d"><text x="540" y="430" text-anchor="middle" font-size="30" font-weight="700">किसान <tspan fill="#2f5d50">सेतु</tspan></text><circle cx="540" cy="300" r="55" fill="#d9e8a6"/><path d="M520 320c5-46 29-62 58-65-4 35-21 59-58 65Z" fill="none" stroke="#2f5d50" stroke-width="8"/><text x="320" y="535" font-size="14" fill="#7e887f" letter-spacing="2">आपके कृषि सहयोगी में स्वागत है</text><text x="320" y="600" font-family="Georgia,serif" font-size="46">किसानसेतु प्रवेश</text><text x="320" y="650" font-size="19" fill="#748078">चुनें कि आप मार्केटप्लेस का उपयोग कैसे करना चाहते हैं।</text><rect x="320" y="740" width="440" height="145" rx="14" fill="#edf3df" stroke="#b9cf8a"/><circle cx="370" cy="812" r="27" fill="#2f5d50"/><path d="M360 817c7-28 24-28 32 0" fill="none" stroke="#fff" stroke-width="5"/><text x="420" y="805" font-size="23" font-weight="700">किसान</text><text x="420" y="838" font-size="16" fill="#748078">फसल बेचें और भुगतान ट्रैक करें</text><rect x="320" y="915" width="440" height="145" rx="14" fill="#fff" stroke="#dedfd7"/><circle cx="370" cy="987" r="27" fill="#fae0c8"/><path d="M358 987h25M370 975v25" stroke="#9a512f" stroke-width="5"/><text x="420" y="980" font-size="23" font-weight="700">क्रेता</text><text x="420" y="1013" font-size="16" fill="#748078">सत्यापित उपज सीधे प्राप्त करें</text><rect x="320" y="1125" width="440" hei