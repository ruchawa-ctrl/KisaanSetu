<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><filter id="s"><feDropShadow dy="22" stdDeviation="20" flood-opacity=".16"/></filter></defs><rect width="1080" height="1920" fill="#eef3e4"/><rect x="210" y="55" width="660" height="1810" rx="76" fill="#253c31" filter="url(#s)"/><rect x="270" y="112" width="540" height="1696" rx="45" fill="#f6f4ed"/><rect x="478" y="89" width="104" height="8" rx="4" fill="#18231d"/><g font-family="DM Sans,Segoe UI,sans-serif" fill="#18231d"><rect x="270" y="112" width="540" height="84" fill="#fbfaf6"/><text x="310" y="165" font-size="23" font-weight="600">किसान <tspan fill="#2f5d50">सेतु</tspan></text><circle cx="778" cy="154" r="19" fill="#2f5d50"/><text x="778" y="161" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">एफ.सी.</text><text x="315" y="255" font-size="13" fill="#7e887f" letter-spacing="2">प्रत्यक्ष खरीद</text><text x="315" y="310" font-family="Georgia,serif" font-size="38">उपलब्ध फसल</text><text x="315" y="350" font-size="18" fill="#748078">सत्यापित किसानों से बेहतर उपज प्राप्त करें।</text><rect x="315" y="405" width="450" height="130" rx="14" fill="#dfe9c5"/><text x="340" y="445" font-size="13" fill="#59783c" font-weight="700">खुली खरीदार निविदा</text><text x="340" y="484" font-size="22" font-weight="700">आप क्या ढूंढ रहे हैं?</text><text x="340" y="515" font-size="16" fill="#748078">सत्यापित किसानों के लिए आरएफक्यू बनाएं</text><rect x="315" y="575" width="450" height="210" rx="14" fill="#fbfaf6" stroke="#dedfd7"/><text x="340" y="615" font-size="13" fill="#7e887f" letter-spacing="1">नासिक लाल प्याज</text><text x="340" y="657" font-size="23" font-weight="700">820 किग्रा · ग्रेड ए</text><text x="340" y="701" font-size="18" fill="#748078">सुरेश पाटिल · सत्यापित किसान</text><text x="340" y="750" font-size="29" fill="#2f5d50" font-weight="700">₹2,450<tspan font-size="15">/क्विंटल</tspan></text><rect x="580" y="714" width="145" height="43" rx="6" fill="#2f5d50"/><text x="653" y="742" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">लॉट देखें</text><rect x="315" y="830" width="450" height="210" rx="14" fill="#fbfaf6" stroke="#dedfd7"/><text x="340" y="870" font-size="13" fill="#7e887f" letter-spacing="1">लातूर सोयाबीन</text><text x="340" y="912" font-size="23" font-weight="700">1,240 किग्रा · ग्रेड बी</text><text x="340" y="956" font-size="18" fill="#748078">महालक्ष्मी एफपीओ · सत्यापित</text><text x="340" y="1005" font-size="29" fill="#2f5d50" font-weight="700">₹4,720<tspan font-size="15">/क्विंटल</tspan></text><rect x="315" y="1125" width="450" height="62" rx="8" fill="#2f5d50"/><text x="540" y="1165" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">+ आरएफक्यू बनाएं</text></g></svg>