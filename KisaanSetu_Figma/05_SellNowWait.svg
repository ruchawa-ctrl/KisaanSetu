<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><filter id="s"><feDropShadow dy="22" stdDeviation="20" flood-opacity=".16"/></filter></defs><rect width="1080" height="1920" fill="#eef3e4"/><rect x="210" y="55" width="660" height="1810" rx="76" fill="#253c31" filter="url(#s)"/><rect x="270" y="112" width="540" height="1696" rx="45" fill="#f6f4ed"/><rect x="478" y="89" width="104" height="8" rx="4" fill="#18231d"/><g font-family="DM Sans,Segoe UI,sans-serif" fill="#18231d"><text x="315" y="260" font-size="13" fill="#7e887f" letter-spacing="2">निर्णय सहायता</text><text x="315" y="320" font-family="Georgia,serif" font-size="37">अच्छे समय के लिए रुकें</text><text x="315" y="366" font-size="18" fill="#748078">आपका प्याज अगले कुछ दिनों में अधिक कमा सकता है।</text><rect x="315" y="430" width="450" height="280" rx="18" fill="#dfe9c5"/><circle cx="540" cy="545" r="78" fill="#edf3df"/><path d="M540 492v57l39 28" fill="none" stroke="#2f5d50" stroke-width="11" stroke-linecap="round"/><circle cx="540" cy="545" r="7" fill="#2f5d50"/><text x="540" y="655" text-anchor="middle" font-size="16" fill="#59783c" font-weight="700">अनुशंसित समय तक 3 दिन</text><rect x="315" y="760" width="450" height="145" rx="14" fill="#fbfaf6" stroke="#dedfd7"/><text x="340" y="805" font-size="14" fill="#7e887f">वर्तमान मोडल</text><text x="340" y="850" font-size="32" fill="#2f5d50" font-weight="700">₹2,450/क्विंटल</text><text x="590" y="850" font-size="16" fill="#467d52">+6.8%</text><text x="315" y="1000" font-size="14" fill="#7e887f" letter-spacing="2">अनुमान, गारंटी नहीं</text><text x="315" y="1045" font-size="18" fill="#56635b">बाजार की स्थिति बदल सकती है। हम</text><text x="315" y="1077" font-size="18" fill="#56635b">उपलब्ध जानकारी पर नजर रखते रहेंगे।</text><rect x="315" y="1160" width="450" height="62" rx="8" fill="#2f5d50"/><text x="540" y="1200" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">निगरानी करते रहें</text></g></svg>